<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Bruno">
  <defs>
    <clipPath id="badge"><circle cx="256" cy="256" r="256"/></clipPath>
    <clipPath id="shirt"><path d="M92 512 C96 436 168 404 256 404 C344 404 416 436 420 512 Z"/></clipPath>
  </defs>
  <g clip-path="url(#badge)">
    <circle cx="256" cy="256" r="256" fill="#2F80C0"/>
    <circle cx="256" cy="256" r="240" fill="none" stroke="#F2C14E" stroke-width="16"/>
    <!-- Breton shirt -->
    <path d="M92 512 C96 436 168 404 256 404 C344 404 416 436 420 512 Z" fill="#FFFFFF"/>
    <g clip-path="url(#shirt)" fill="#1E3A5F">
      <rect x="80" y="428" width="360" height="13"/>
      <rect x="80" y="456" width="360" height="13"/>
      <rect x="80" y="484" width="360" height="13"/>
    </g>
    <!-- ears -->
    <circle cx="140" cy="292" r="26" fill="#E3A97E"/>
    <circle cx="372" cy="292" r="26" fill="#E3A97E"/>
    <circle cx="142" cy="294" r="12" fill="#C98A62"/>
    <circle cx="370" cy="294" r="12" fill="#C98A62"/>
    <!-- face -->
    <ellipse cx="256" cy="286" rx="118" ry="128" fill="#EDB98F"/>
    <!-- grey tufts under the cap -->
    <g fill="#8C8C8C">
      <circle cx="140" cy="226" r="16"/><circle cx="152" cy="210" r="14"/><circle cx="134" cy="244" r="12"/>
      <circle cx="372" cy="226" r="16"/><circle cx="360" cy="210" r="14"/><circle cx="378" cy="244" r="12"/>
    </g>
    <!-- flat cap (coppola) -->
    <path d="M124 214 C118 150 188 108 262 108 C342 108 398 148 390 208 Z" fill="#5A7340"/>
    <path d="M140 206 Q256 252 374 204 Q366 232 256 240 Q150 238 140 206 Z" fill="#42582F"/>
    <path d="M150 182 Q256 160 362 178" fill="none" stroke="#6D8A50" stroke-width="6" stroke-linecap="round"/>
    <circle cx="262" cy="112" r="9" fill="#42582F"/>
    <!-- eyebrows: one raised, for goofiness -->
    <path d="M182 240 Q210 218 240 236" fill="none" stroke="#2B1B12" stroke-width="15" stroke-linecap="round"/>
    <path d="M276 226 Q306 198 336 220" fill="none" stroke="#2B1B12" stroke-width="15" stroke-linecap="round"/>
    <!-- mismatched googly eyes -->
    <ellipse cx="212" cy="266" rx="22" ry="25" fill="#FFFFFF"/>
    <ellipse cx="304" cy="260" rx="27" ry="30" fill="#FFFFFF"/>
    <circle cx="219" cy="271" r="10" fill="#2B1B12"/>
    <circle cx="312" cy="266" r="12" fill="#2B1B12"/>
    <circle cx="222" cy="267" r="3.5" fill="#FFFFFF"/>
    <circle cx="316" cy="261" r="4" fill="#FFFFFF"/>
    <!-- rosy cheeks -->
    <circle cx="180" cy="322" r="23" fill="#EE8E7C" opacity="0.55"/>
    <circle cx="336" cy="322" r="23" fill="#EE8E7C" opacity="0.55"/>
    <!-- big grin -->
    <path d="M212 352 Q258 414 304 352 Z" fill="#7A2525"/>
    <path d="M222 353 L294 353 L290 365 Q258 372 226 365 Z" fill="#FFFFFF"/>
    <ellipse cx="258" cy="373" rx="16" ry="8" fill="#D9544F"/>
    <!-- round nose -->
    <ellipse cx="258" cy="308" rx="37" ry="33" fill="#DA8A63"/>
    <ellipse cx="246" cy="297" rx="11" ry="7" fill="#FFFFFF" opacity="0.5"/>
    <!-- handlebar moustache -->
    <path d="M258 338 C240 320 200 322 184 340 C172 354 150 352 146 334 C158 342 168 336 172 328 C192 308 236 312 258 328 Z" fill="#2B1B12"/>
    <path d="M258 338 C276 320 316 322 332 340 C344 354 366 352 370 334 C358 342 348 336 344 328 C324 308 280 312 258 328 Z" fill="#2B1B12"/>
  </g>
</svg>
